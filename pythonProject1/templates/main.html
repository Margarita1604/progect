<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>main</title>
</head>
<body>
{% include 'header.html'%}
<a href="/login">войти</a>
{% with messages = get_flashed_messages(with_categories=true) %}

        {{ message }}

    {% endfor %}
  {% endif %}
{% endwith %}
</body>
</html>
