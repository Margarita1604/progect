<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <title>login</title>
</head>

<body>
{% include 'header.html'%}
<div class="login_form">
  <div class="card" style="max-width:420px; margin:40px auto;">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
    <h2 style="margin-bottom:12px;">Вход</h2>

    <form method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <div style="height:12px;"></div>

      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required>

      <div style="height:18px;"></div>

      <button class="btn" type="submit" style="width:100%;">Войти</button>
    </form>

    <div class="muted" style="margin-top:14px; text-align:center;">
      Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a>
    </div>
  </div>
</div>

</body>
</html>
